name: LLM-iOS
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    # Merged with the generated plist to carry UIFileSharingEnabled, which the
    # INFOPLIST_KEY_ settings can't express.
    INFOPLIST_FILE: Info.plist
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "LLM-iOS"
    INFOPLIST_KEY_NSCameraUsageDescription: "LLM-iOS uses the camera to take photos to attach to your messages."
    # Expose the app's Documents folder in the Files app (On My iPhone → LLM-iOS)
    # so the DEBUG sample files are reachable from the file picker.
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  LLM-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LLMApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.llmios
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LLM-iOS:
    build:
      targets:
        LLM-iOS: all
    run:
      config: Debug
