name: LLM-iOS
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    # Merged with the generated plist to carry UIFileSharingEnabled, which the
    # INFOPLIST_KEY_ settings can't express.
    INFOPLIST_FILE: Info.plist
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "LLM-iOS"
    # Portrait-only (per Dan 2026-07-16) — landscape isn't a supported
    # experience, so nothing needs to reflow/re-pin for it.
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: "LLM-iOS uses the camera to take photos to attach to your messages."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "LLM-iOS uses the microphone for live voice conversations with the assistant."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "LLM-iOS uses speech recognition to turn what you say into text during a voice conversation."
    # Expose the app's Documents folder in the Files app (On My iPhone → LLM-iOS)
    # so the DEBUG sample files are reachable from the file picker.
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # HM53U2L7X8 (Personal Team, danselleck82@gmail.com) — the one signing
    # identity in the keychain (`security find-identity -v -p codesigning`).
    # The 2026-07-19 "No Account for Team HM53U2L7X8" error wasn't actually a
    # stale/wrong team ID — it was a stale provisioning profile; reselecting
    # the team in Xcode's Signing & Capabilities UI regenerated a fresh one
    # and fixed it. Kept here so `xcodegen generate` doesn't wipe the
    # selection back out.
    DEVELOPMENT_TEAM: HM53U2L7X8
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Xcode's "Update to recommended settings" prompt (per Dan 2026-07-19) —
    # added here instead of clicking "Continue" in that dialog, which would've
    # written straight to the .xcodeproj and been wiped by the next
    # `xcodegen generate`. Neither does anything functional yet (no build
    # scripts to sandbox, no String Catalogs in use), just keeps the project
    # current with Xcode's defaults.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  LLM-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LLMApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.llmios
        TARGETED_DEVICE_FAMILY: "1"
  # ponytail: debug-only UI test target — the sandbox has no reliable
  # synthetic-touch input for the simulator, but XCUITest drives the app
  # through Apple's own accessibility/testmanagerd channel instead of fake
  # mouse events, so it reliably reproduces the scroll bug's send flow.
  # Not shipped, not referenced by the app target.
  LLMDebugUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LLMDebugUITests
    dependencies:
      - target: LLM-iOS
    settings:
      base:
        # Explicit, not just inherited from the project-level base settings
        # above — Xcode's Signing & Capabilities UI doesn't reliably read an
        # inherited team for a target, showing it as unselected and prompting
        # Dan to re-pick it every time he opens the project (per Dan
        # 2026-07-19). Same team as LLM-iOS; this target isn't shipped, so
        # any working dev team would do.
        DEVELOPMENT_TEAM: HM53U2L7X8
schemes:
  LLM-iOS:
    build:
      targets:
        LLM-iOS: all
        LLMDebugUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LLMDebugUITests
